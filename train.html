<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр</title>
<meta name="description" content="Карточки, выбор перевода, правописание и «послушай и выбери»">
<meta name="theme-color" content="#4B2C8C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖋️%3C/text%3E%3C/svg%3E">
<script>try{var t=JSON.parse(localStorage.getItem("te:theme"));if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
<header id="top"></header>
<nav id="nav" aria-label="Разделы"></nav>
<main id="main">
<h1 class="page">Тренажёр</h1>
<p class="note">Сначала идут невыученные слова. Выборка: <b id="scope"></b>.</p>
<div class="filters" id="filters"></div>
<div class="modes" role="group" aria-label="Режим">
  <button class="btn" type="button" data-mode="cards">Карточки</button>
  <button class="btn ghost" type="button" data-mode="quiz">Выбор перевода</button>
  <button class="btn ghost" type="button" data-mode="listen">Послушай и выбери</button>
  <button class="btn ghost" type="button" data-mode="spell">Правописание</button>
</div>
<div class="opts-line">
  <select class="chip" id="dir" aria-label="Направление"><option value="en">EN → RU</option><option value="ru">RU → EN</option></select>
  <select class="chip" id="lopt" aria-label="Варианты ответа"><option value="ru">Варианты: перевод</option><option value="en">Варианты: слово</option></select>
  <select class="chip" id="size" aria-label="Слов за раунд"><option value="10">10 слов</option><option value="20">20 слов</option><option value="0">Все слова</option></select>
</div>
<div class="stage" id="stage" aria-live="polite"></div>
</main>
<footer>Tattoo English · прогресс хранится только в этом браузере</footer>
</div>
<script type="module" src="assets/js/train.js"></script>
</body>
</html>
